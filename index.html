<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayCUBE</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <nav id="navbar" class="navbar menuNav fixed-top">
      <div
        class="container-sm d-flex justify-content-between align-items-center"
      >
        <img alt="PlayCube logo" style="content: var(--playcube-logo-clara)" />
        <div class="d-flex align-items-center">
          <div class="text-light mx-2 titleText">Filmes</div>
          <div class="text-light mx-2 titleText">Séries</div>
        </div>
      </div>
    </nav>
    <section id="movie" class="lightBackground py-5">
      <div class="container-sm w-100 d-flex">
        <img src="" alt="" class="posterImage" />
        <div class="ml-4 w-100 d-flex flex-column">
          <h1 class="fs-1 mb-0"></h1>
          <div class="mb-3">
            <p class="mb-1 font-weight-bold">Gênero:</p>
            <span id="genre"></span>
          </div>
          <div class="mb-3">
            <p class="mb-1 font-weight-bold">Sinopse:</p>
            <span id="sinopse"></span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <div>
              <p class="mb-1 font-weight-bold">Dirigido por:</p>
              <span id="diretor"></span>
            </div>
            <div>
              <p class="mb-1 font-weight-bold">Escrito por:</p>
              <span id="roteirista"></span>
            </div>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <div>
              <p class="mb-1 font-weight-bold">Situação:</p>
              <span id="status"></span>
            </div>
            <div>
              <p class="mb-1 font-weight-bold">Idioma original:</p>
              <span id="idioma"></span>
            </div>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <div>
              <p class="mb-1 font-weight-bold">Orçamento:</p>
              <span id="orcamento" class="d-block"></span>
            </div>
            <div>
              <p class="mb-1 font-weight-bold">Receita:</p>
              <span id="receita" class="d-block"></span>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="elenco" class="castSection py-5">
      <div class="container-sm position-relative">
        <div class="d-flex align-items-center row">
          <h2 class="mr-3">Elenco</h2>
          <button type="button" class="btn seeMoreButton mr-3">Ver mais</button>
        </div>

        <div class="position-relative carrosselLine">
          <img
            src="./assets/lateral-clara-esquerda.png"
            alt="Lateral esquerda"
            class="lateral-esquerda"
          />
          <img
            src="./assets/lateral-clara-direita.png"
            alt="Lateral direita"
            class="lateral-direita"
          />
          <div
            id="carouselElenco"
            class="d-flex overflow-auto w-100"
            style="scroll-snap-type: x mandatory; gap: 1rem"
          ></div>
        </div>
      </div>
    </section>
    <section id="reviews" class="lightBackground py-5">
      <div class="container-sm">
        <div class="d-flex align-items-center row">
          <h2 class="mr-3">Resenhas</h2>
          <button type="button" class="btn seeMoreButton mr-3">Ver mais</button>
        </div>
        <div
          id="reviewsContainer"
          class="d-flex w-100 horizontal-scroll"
          style="
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 1rem;
            white-space: nowrap;
          "
        >
          <div
            class="cardContainer mx-3"
            style="
              min-width: 300px;
              scroll-snap-align: start;
              display: inline-block;
            "
            id="reviewTemplate"
            hidden
          ></div>
        </div>
      </div>
    </section>
    <section id="media">
      <div class="container-sm">
        <div>
          <div class="d-flex align-items-center row">
            <h2 class="mr-3">Mídia</h2>
          </div>
          <div class="container-sm">
            <div class="d-flex align-items-center row">
              <h3 class="mr-3">
                Vídeos <span id="videoCount" class="text-muted">(0)</span>
              </h3>
              <button class="btn seeMoreButton">Ver mais</button>
            </div>
            <div
              id="videoScroller"
              class="d-flex w-100 horizontal-scroll"
              style="
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                gap: 1rem;
                white-space: nowrap;
              "
            >
              <div
                class="videoCard mx-3"
                style="
                  min-width: 300px;
                  scroll-snap-align: start;
                  display: inline-block;
                "
                id="videoTemplate"
                hidden
              ></div>
            </div>
          </div>
          <div
            id="videoScroller"
            class="d-flex horizontal-scroll w-100 mt-3"
            style="scroll-snap-type: x mandatory; gap: 1rem"
          ></div>
          <h3 class="mt-4">Pôsteres</h3>
          <div id="postersContainer" class="media-scroll"></div>

          <h3 class="mt-4">Imagens de fundo</h3>
          <div id="backdropsContainer" class="media-scroll"></div>
        </div>
      </div>
    </section>

    <section id="recomendation" class="recomendationSection">
      <div class="container-sm">
        <div class="mb-4 text-center">
          <img src="" alt="Pôster de [Título]" style="width: 150px" />
          <h3>[Título]</h3>
          <h4>Aprovação: 8.5 / 10</h4>
        </div>
      </div>
    </section>
    <footer id="footer">
      <div class="container-sm">
        <div>
          <img
            alt="PlayCube logo"
            src=""
            style="content: var(--playcube-logo-escura)"
          />
        </div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
