<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayCUBE</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <nav id="navbar" class="navbar menuNav fixed-top">
      <div
        class="container-sm d-flex justify-content-between align-items-center"
      >
        <img alt="PlayCube logo" style="content: var(--playcube-logo-clara)" />
        <div class="d-flex align-items-center">
          <div class="text-light mx-2 titleText">Filmes</div>
          <div class="text-light mx-2 titleText">Séries</div>
        </div>
      </div>
    </nav>
    <section id="movie" class="movieSection py-5">
      <div class="container-sm w-100 d-flex">
        <img src="" alt="" class="posterImage" />
        <div class="ml-4 w-100 d-flex flex-column">
          <h1 class="fs-1 mb-0"></h1>
          <div class="mb-3">
            <p class="mb-1 font-weight-bold">Gênero:</p>
            <span id="genre"></span>
          </div>
          <div class="mb-3">
            <p class="mb-1 font-weight-bold">Sinopse:</p>
            <span id="sinopse"></span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <div>
              <p class="mb-1 font-weight-bold">Dirigido por:</p>
              <span id="diretor"></span>
            </div>
            <div>
              <p class="mb-1 font-weight-bold">Escrito por:</p>
              <span id="roteirista"></span>
            </div>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <div>
              <p class="mb-1 font-weight-bold">Situação:</p>
              <span id="status"></span>
            </div>
            <div>
              <p class="mb-1 font-weight-bold">Idioma original:</p>
              <span id="idioma"></span>
            </div>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <div>
              <p class="mb-1 font-weight-bold">Orçamento:</p>
              <span id="orcamento" class="d-block"></span>
            </div>
            <div>
              <p class="mb-1 font-weight-bold">Receita:</p>
              <span id="receita" class="d-block"></span>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="elenco" class="castSection py-5">
      <div class="container-sm">
        <h2>Elenco</h2>
        <div
          id="carouselElenco"
          class="d-flex overflow-auto"
          style="scroll-snap-type: x mandatory; gap: 1rem"
        ></div>
      </div>
    </section>
    <section id="media">
      <div class="container-sm">
        <div>
          <h2>Mídia</h2>
          <h3>Vídeos</h3>
          <h3>Pôsteres</h3>
          <h3>Imagens de fundo</h3>
        </div>
      </div>
    </section>
    <section id="recomendation" class="recomendationSection">
      <div class="container-sm">
        <div class="mb-4 text-center">
          <img src="" alt="Pôster de [Título]" style="width: 150px" />
          <h3>[Título]</h3>
          <h4>Aprovação: 8.5 / 10</h4>
        </div>
      </div>
    </section>
    <footer id="footer">
      <div class="container-sm">
        <div>
          <img
            alt="PlayCube logo"
            src=""
            style="content: var(--playcube-logo-escura)"
          />
        </div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
<style>
  @import url("https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap");
  :root {
    --playcube-logo-clara: url("../assets/logo-clara.png");
    --playcube-logo-escura: url("../assets/logo-escura.png");
    --red: #ff0000;
    --dark-blue: #102c57;
    --light-bege: #f8f0e5;
    --medium-bege: #eadbc8;
    --dark-bege: #dac0a3;
    --font-color: #333333;
    --font-bold: 700;
    --font-regular: 400;
    --regular-font-size: 24px;
  }
  body {
    padding-top: 100px;
    color: var(--font-color);
  }
  .menuNav {
    background-color: var(--dark-blue);
    color: #f8f0e5;
    height: 100px;
    width: 100%;
  }
  .movieSection {
    background-color: var(--light-bege);
  }
  .castSection {
    background-color: var(--dark-bege);
  }
  .posterImage {
    width: 400px;
    height: 600px;
  }
  .titleText {
    font-weight: var(--font-bold);
  }
  #carouselElenco {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  #carouselElenco::-webkit-scrollbar {
    display: none;
  }
</style>
